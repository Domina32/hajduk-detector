# Bump the SHA-pinned GitHub Actions. Dependabot rewrites the pin (commit SHA
# plus the version comment) in a PR, and CI runs on pull requests, so every bump
# is tested before it lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per week for all actions instead of one PR per action.
    groups:
      github-actions:
        patterns:
          - "*"
