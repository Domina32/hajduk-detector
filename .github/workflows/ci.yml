# CI — run the test suites on every push and every pull request.
#
# Deliberately minimal: tests only. No issue/PR templates, labelers, project
# boards or deploy workflows (single collaborator, no issue tracker).
# Linting/formatting is handled locally by the `prek` git hooks.
#
# Every action is pinned to a full commit SHA — the `zizmor` pre-commit hook
# rejects tag refs.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Settings reads the tracked `../.env`, but FastAPI's "is the frontend build
  # present?" check reads `FASTAPI_ENV` from the process environment. The build
  # output (`backend/app/frontend/`) is gitignored, so it is absent here and the
  # check must be relaxed for the backend to start.
  FASTAPI_ENV: development

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Start PostgreSQL and Mailpit
        run: docker compose up -d --wait db mailpit

      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend

      - name: Coverage gate
        run: uv run coverage report --fail-under=90
        working-directory: backend

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Start PostgreSQL and Mailpit
        run: docker compose up -d --wait db mailpit

      - name: Migrate database and create the superuser
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start the backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
        working-directory: backend

      - name: Wait for the backend
        run: curl --retry 30 --retry-delay 2 --retry-all-errors --fail http://localhost:8000/api/v1/utils/health-check/

      - name: Run tests
        run: npm test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: |
            frontend/test-results
            frontend/blob-report
          include-hidden-files: true
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans
