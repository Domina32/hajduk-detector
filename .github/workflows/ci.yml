# CI — run the backend test suite on every push and every pull request.
#
# Deliberately minimal: tests only. No issue/PR templates, labelers, project
# boards or deploy workflows (single collaborator, no issue tracker).
# Linting/formatting is handled locally by the `prek` git hooks.
#
# Every action is pinned to a full commit SHA — the `zizmor` pre-commit hook
# rejects tag refs.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FASTAPI_ENV: development

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest-known"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Start PostgreSQL and Mailpit
        run: docker compose up -d --wait db mailpit

      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend

      - name: Coverage gate
        run: uv run coverage report --fail-under=90
        working-directory: backend

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans
