# Deployment overlay for the private server.
#
# The app is never exposed to the internet (PLAN.md decision 17): no published
# ports, no reverse proxy, no domain. Consumers read the Google Sheet and
# receive email; nothing connects to this API from outside.
#
# Use it explicitly, so the local development override is not applied:
#
#   docker compose -f compose.yml -f compose.deploy.yml up -d

services:

  db:
    restart: always

  backend:
    restart: always
