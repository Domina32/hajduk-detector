services:
  db:
    ports:
      # Loopback only: the dev database must not be reachable from the LAN
      - "127.0.0.1:5432:5432"

  backend:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - dev
      - --host
      - "0.0.0.0"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild

    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"

  mailpit:
    image: axllent/mailpit
    ports:
      # Loopback only: dev emails (incl. reset links) must not face the LAN.
      # Container-to-container traffic uses the Docker network, not these.
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
