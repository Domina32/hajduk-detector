[dependency-groups]
dev = [
    "prek>=0.4.14,<1.0.0",
    "zizmor>=1.29.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "package-lock.json",
    "backend/coverage/",
    "backend/htmlcov/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.pyrefly]
# Sole type checker for the backend (replaces mypy + ty).
required-version = ">=1.4.0,<2.0.0"
preset = "strict"
project-includes = ["backend/app/**/*.py"]
project-excludes = [
    "**/alembic/**",
    "**/node_modules/**",
    "**/.venv/**",
]
# `app` is a package under backend/, so that is the import root.
search-path = ["backend"]
python-version = "3.14"
