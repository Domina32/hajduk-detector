[dependency-groups]
dev = [
    "prek>=0.4.14,<1.0.0",
    "typer>=0.27.1,<1.0.0",
    "zizmor>=1.29.0",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.ruff.lint.per-file-ignores]
# Only `backend/` has a pyproject.toml of its own; without a table here, ruff
# falls back to its built-in defaults for the repo-root tooling, which are much
# broader than the rules the backend uses. DTZ011 demands a tz-aware timestamp,
# but the release tooling deliberately stamps a plain local date.
"scripts/**" = ["DTZ011"]
"hooks/**" = ["DTZ011"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "package-lock.json",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
